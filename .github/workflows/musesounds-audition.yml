name: Free MuseSounds audition
on:
  push:
    branches: [audition/musesounds]
    paths:
      - .github/workflows/musesounds-audition.yml
      - scripts/prepare-musesounds-audition.mjs
      - scripts/render-musesounds-audition.sh
permissions:
  contents: read
concurrency:
  group: musesounds-audition
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-musesounds-audition.mjs
      - run: bash scripts/render-musesounds-audition.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcbride-musesounds-audition
          path: output/tooling/musesounds-audition/
          retention-days: 1
          if-no-files-found: error
